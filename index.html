<!DOCTYPE html>
<!--
  CATÁLOGO WEB DE FINCA BORNET CON ASISTENTE DE IA Y PEDIDOS POR WHATSAPP
  FINCA BORNET WEB CATALOG WITH AI ASSISTANT AND WHATSAPP ORDERS
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finca Bornet | Cacao orgánico de Guatuso</title>
<meta name="description" content="Catálogo de productos de cacao orgánico de Finca Bornet, Guatuso, Costa Rica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
  /* Paleta tomada del cacao: grano, mazorca madura, hoja y pulpa. */
  /* Palette taken from cacao: bean, ripe pod, leaf and pulp. */
  :root {
    --cacao: #3A2117; --cacao-soft: #6B4A3A; --mazorca: #E0A526;
    --hoja: #2E5E3A; --pulpa: #FFFDF8; --linea: #E8E0D6;
    --display: "Young Serif", Georgia, serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pulpa); color: var(--cacao); font: 16px/1.5 var(--body); }
  :focus-visible { outline: 3px solid var(--mazorca); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  [hidden] { display: none !important; }

  /* Encabezado: el único elemento llamativo de la página. */
  /* Header: the only eye-catching element on the page. */
  header { background: var(--cacao); color: var(--pulpa); padding: 2.5rem 1.25rem 2rem; }
  header .wrap { display: flex; gap: 1rem; align-items: center; }
  header svg { flex: none; width: 56px; height: 72px; }
  header h1 { font: 2.6rem/1 var(--display); color: var(--mazorca); margin: 0 0 .4rem; }
  header p { margin: 0; max-width: 32ch; opacity: .9; }

  .wrap { max-width: 640px; margin: 0 auto; }
  main { padding: 1.25rem 1.25rem 9rem; }
  h2 { font: 1.4rem/1.2 var(--display); margin: 1.5rem 0 .5rem; }

  /* Lista de productos. / Product list. */
  .producto { display: grid; grid-template-columns: 72px 1fr; gap: .9rem; padding: 1rem 0; border-bottom: 1px solid var(--linea); }
  .foto { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #F1E7DA; display: grid; place-items: center; }
  .producto h3 { font: 1.1rem/1.25 var(--display); margin: 0; }
  .pres { color: var(--cacao-soft); font-size: .9rem; }
  .desc { margin: .3rem 0 .5rem; font-size: .95rem; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .precio { font-weight: 700; font-size: 1.05rem; }
  .agotado { color: var(--cacao-soft); font-size: .9rem; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--linea); border-radius: 999px; }
  .stepper button { width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--cacao); font-size: 1.25rem; }
  .stepper output { min-width: 1.5rem; text-align: center; font-weight: 700; }

  .info p { margin: .25rem 0 .75rem; }
  .estado { padding: 2rem 0; text-align: center; color: var(--cacao-soft); }
  .estado button { margin-top: .75rem; }

  /* Barra inferior del pedido (solo con productos) y botón flotante del asistente. */
  /* Bottom order bar (only with products) and floating assistant button. */
  .barra { position: fixed; inset: auto 0 0; background: var(--pulpa); border-top: 1px solid var(--linea); padding: .75rem 1.25rem; }
  .btn-preguntar { position: fixed; right: 1.25rem; bottom: 1.25rem; box-shadow: 0 2px 8px rgb(58 33 23 / .25); }
  body.con-pedido .btn-preguntar { bottom: 5.5rem; }
  .barra .wrap { display: flex; gap: .75rem; align-items: center; justify-content: space-between; }
  .total { font-size: .95rem; }
  .total strong { display: block; font-size: 1.15rem; }
  .btn { border: 0; border-radius: 999px; padding: .75rem 1.25rem; font-weight: 700; }
  .btn-pedir { background: var(--hoja); color: #fff; }
  .btn-preguntar { background: var(--mazorca); color: var(--cacao); }
  .btn-sec { background: none; border: 1px solid var(--cacao); color: var(--cacao); }

  /* Panel del asistente. / Assistant panel. */
  dialog { border: 0; padding: 0; width: min(640px, 100%); max-height: 85vh; margin: auto auto 0; border-radius: 16px 16px 0 0; background: var(--pulpa); color: var(--cacao); }
  dialog::backdrop { background: rgb(58 33 23 / .45); }
  .chat { display: flex; flex-direction: column; height: min(85vh, 620px); }
  .chat-head { display: flex; justify-content: space-between; align-items: start; padding: 1rem 1.25rem .5rem; }
  .chat-head h2 { margin: 0; }
  .chat-head small { color: var(--cacao-soft); }
  .cerrar { border: 0; background: none; font-size: 1.5rem; color: var(--cacao); }
  .mensajes { flex: 1; overflow-y: auto; padding: .5rem 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
  .msg { max-width: 85%; padding: .6rem .85rem; border-radius: 14px; white-space: pre-wrap; }
  .msg.bot { background: #F1E7DA; align-self: flex-start; }
  .msg.user { background: var(--cacao); color: var(--pulpa); align-self: flex-end; }
  .sugerencias { display: flex; gap: .5rem; flex-wrap: wrap; padding: 0 1.25rem .5rem; }
  .sugerencias button { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: .35rem .8rem; font-size: .9rem; color: var(--cacao); }
  .chat form { display: flex; gap: .5rem; padding: .75rem 1.25rem 1rem; border-top: 1px solid var(--linea); }
  .chat input { flex: 1; min-width: 0; border: 1px solid var(--linea); border-radius: 999px; padding: .7rem 1rem; font: inherit; }

  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: subir .2s ease-out; }
    @keyframes subir { from { transform: translateY(30px); opacity: 0; } }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <!-- Mazorca de cacao dibujada a mano en SVG. / Hand-drawn cacao pod in SVG. -->
    <svg viewBox="0 0 56 72" aria-hidden="true">
      <path d="M28 2C13 10 6 26 8 42c2 15 10 26 20 28 10-2 18-13 20-28 2-16-5-32-20-40z" fill="#E0A526"/>
      <path d="M28 6v62M18 12c-4 14-4 34 2 52M38 12c4 14 4 34-2 52" stroke="#3A2117" stroke-width="2" fill="none" opacity=".35"/>
    </svg>
    <div>
      <h1 id="nombre">Finca Bornet</h1>
      <p id="lema">Cacao orgánico de Guatuso, hecho a mano por la familia</p>
    </div>
  </div>
</header>

<main class="wrap">
  <h2>Productos</h2>
  <div id="productos"><p class="estado">Cargando el catálogo…</p></div>
  <section class="info" id="info" hidden>
    <h2>Pago y retiro</h2>
    <p id="pago"></p>
    <p id="retiro"></p>
  </section>
</main>

<button class="btn btn-preguntar" id="abrirChat">Preguntar</button>
<div class="barra" id="barra" hidden>
  <div class="wrap">
    <div class="total" id="total" aria-live="polite"></div>
    <button class="btn btn-pedir" id="pedir">Pedir por WhatsApp</button>
  </div>
</div>

<dialog id="dialogo" aria-labelledby="tituloChat">
  <div class="chat">
    <div class="chat-head">
      <div>
        <h2 id="tituloChat">Preguntas sobre los productos</h2>
        <small>Asistente automático. Puede equivocarse; confirme su pedido por WhatsApp.</small>
      </div>
      <button class="cerrar" id="cerrarChat" aria-label="Cerrar">×</button>
    </div>
    <div class="mensajes" id="mensajes" aria-live="polite"></div>
    <div class="sugerencias" id="sugerencias">
      <button>¿Qué productos tienen disponibles?</button>
      <button>¿Cómo puedo pagar?</button>
      <button>¿Dónde retiro el pedido?</button>
    </div>
    <form id="formChat">
      <input id="entrada" autocomplete="off" placeholder="Escriba su pregunta" aria-label="Su pregunta" maxlength="500">
      <button class="btn btn-pedir" type="submit">Enviar</button>
    </form>
  </div>
</dialog>

<script>
  // URL de la aplicación web de Google Apps Script (termina en /exec).
  // URL of the Google Apps Script web app (ends in /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbwfqijd7O47eVLsBC07vz2oEPIgPsFzw_2p0HJ-FljNt9bpSVJxtkVMzFqJTDm_V2r7/exec';

  const $ = id => document.getElementById(id);
  const colones = n => '₡' + Number(n).toLocaleString('es-CR');
  let productos = [], info = {}, carrito = {}, historial = [];

  // Carga productos e información del negocio desde la hoja.
  // Loads products and business info from the sheet.
  async function cargar() {
    $('productos').innerHTML = '<p class="estado">Cargando el catálogo…</p>';
    try {
      const data = await (await fetch(API_URL)).json();
      if (data.error) throw new Error(data.error);
      productos = data.products; info = data.info;
      pintarInfo(); pintarProductos();
    } catch (e) {
      $('productos').innerHTML = '<div class="estado"><p>No se pudo cargar el catálogo. Revise su conexión e intente de nuevo.</p><button class="btn btn-sec" onclick="cargar()">Intentar de nuevo</button></div>';
    }
  }

  // Muestra nombre, lema, pago y retiro tomados de la pestaña Info.
  // Shows name, tagline, payment and pickup taken from the Info tab.
  function pintarInfo() {
    if (info.nombre) $('nombre').textContent = info.nombre;
    if (info.lema) $('lema').textContent = info.lema;
    $('pago').textContent = info.pago || '';
    $('retiro').textContent = info.retiro || '';
    $('info').hidden = false;
  }

  // Dibuja la lista de productos con su selector de cantidad.
  // Renders the product list with its quantity selector.
  function pintarProductos() {
    const cont = $('productos');
    cont.innerHTML = '';
    productos.forEach(p => {
      const stock = Number(p.existencias);
      const el = document.createElement('article');
      el.className = 'producto';
      el.innerHTML = `
        ${p.imagen ? '<img class="foto" alt="" loading="lazy">' : '<div class="foto" aria-hidden="true"><svg width="30" height="38" viewBox="0 0 56 72"><path d="M28 2C13 10 6 26 8 42c2 15 10 26 20 28 10-2 18-13 20-28 2-16-5-32-20-40z" fill="#C9B29A"/></svg></div>'}
        <div>
          <h3></h3><div class="pres"></div><p class="desc"></p>
          <div class="fila">
            <span class="precio"></span>
            ${stock > 0
              ? `<div class="stepper"><button aria-label="Quitar uno">−</button><output>0</output><button aria-label="Agregar uno">+</button></div>`
              : '<span class="agotado">Agotado. Se elabora por encargo.</span>'}
          </div>
        </div>`;
      // Texto con textContent para no interpretar HTML de la hoja.
      // Text set with textContent so sheet content is never parsed as HTML.
      if (p.imagen) el.querySelector('img').src = p.imagen;
      el.querySelector('h3').textContent = p.nombre;
      el.querySelector('.pres').textContent = p.presentacion;
      el.querySelector('.desc').textContent = p.descripcion;
      el.querySelector('.precio').textContent = colones(p.precio);
      if (stock > 0) {
        const [menos, mas] = el.querySelectorAll('.stepper button');
        const out = el.querySelector('output');
        const set = n => { carrito[p.id] = n; out.textContent = n; menos.disabled = n === 0; mas.disabled = n >= stock; actualizarTotal(); };
        menos.onclick = () => set((carrito[p.id] || 0) - 1);
        mas.onclick = () => set((carrito[p.id] || 0) + 1);
        set(carrito[p.id] || 0);
      }
      cont.appendChild(el);
    });
  }

  // Lista de líneas del pedido actual. / List of lines in the current order.
  const lineas = () => productos.filter(p => carrito[p.id] > 0).map(p => ({ p, n: carrito[p.id] }));

  // Actualiza la barra inferior con el total del pedido.
  // Updates the bottom bar with the order total.
  function actualizarTotal() {
    const l = lineas();
    const unidades = l.reduce((s, x) => s + x.n, 0);
    const total = l.reduce((s, x) => s + x.n * x.p.precio, 0);
    $('barra').hidden = unidades === 0;
    document.body.classList.toggle('con-pedido', unidades > 0);
    $('total').innerHTML = `${unidades} ${unidades === 1 ? 'producto' : 'productos'}<strong>${colones(total)}</strong>`;
  }

  // Abre WhatsApp con el pedido ya redactado.
  // Opens WhatsApp with the order already written.
  $('pedir').onclick = () => {
    const l = lineas();
    const total = l.reduce((s, x) => s + x.n * x.p.precio, 0);
    const texto = 'Hola, quiero hacer este pedido:\n' +
      l.map(x => `- ${x.n} x ${x.p.nombre} (${x.p.presentacion}): ${colones(x.n * x.p.precio)}`).join('\n') +
      `\nTotal: ${colones(total)}`;
    window.open(`https://wa.me/${info.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
  };

  // ---------- ASISTENTE / ASSISTANT ----------

  // Agrega un mensaje a la conversación. / Adds a message to the conversation.
  function agregar(rol, texto) {
    const div = document.createElement('div');
    div.className = 'msg ' + (rol === 'user' ? 'user' : 'bot');
    div.textContent = texto;
    $('mensajes').appendChild(div);
    $('mensajes').scrollTop = $('mensajes').scrollHeight;
    return div;
  }

  // Envía la pregunta al backend junto con el historial reciente.
  // Sends the question to the backend along with recent history.
  async function preguntar(texto) {
    texto = texto.trim();
    if (!texto) return;
    $('sugerencias').hidden = true;
    agregar('user', texto);
    historial.push({ role: 'user', text: texto });
    const espera = agregar('bot', 'Escribiendo…');
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'chat', messages: historial }) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      espera.textContent = data.reply;
      historial.push({ role: 'model', text: data.reply });
    } catch (e) {
      // Si falla, se elimina la pregunta del historial para poder reintentarla.
      // On failure, the question is removed from history so it can be retried.
      historial.pop();
      espera.textContent = 'No pude responder en este momento. Puede escribir directamente al WhatsApp del negocio.';
    }
  }

  $('abrirChat').onclick = () => {
    $('dialogo').showModal();
    if (!$('mensajes').children.length) agregar('bot', `Hola, soy el asistente de ${info.nombre || 'Finca Bornet'}. Puedo responder preguntas sobre productos, precios, disponibilidad, pago y retiro.`);
    $('entrada').focus();
  };
  $('cerrarChat').onclick = () => $('dialogo').close();
  $('formChat').onsubmit = e => { e.preventDefault(); preguntar($('entrada').value); $('entrada').value = ''; };
  $('sugerencias').querySelectorAll('button').forEach(b => b.onclick = () => preguntar(b.textContent));

  cargar();
</script>
</body>
</html>
